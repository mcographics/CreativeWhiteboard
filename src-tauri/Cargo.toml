[package]
name = "creative-whiteboard"
version = "0.1.0"
description = "An infinite creative desktop workspace"
authors = ["Creative Whiteboard"]
edition = "2021"

[lib]
name = "creative_whiteboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
